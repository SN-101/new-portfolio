    <!-- Set theme + language before first paint (no flash, correct text direction) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
          var l = (localStorage.getItem('lang') || (navigator.languages && navigator.languages[0]) || navigator.language || 'en').slice(0, 2).toLowerCase();
          if (['en', 'fr', 'ar'].indexOf(l) < 0) l = 'en';
          document.documentElement.lang = l;
          document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {}
      })();
    </script>
